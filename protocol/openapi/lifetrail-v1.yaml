openapi: 3.1.0
info:
  title: LifeTrail API
  version: v1
  description: Phase 1 reusable API-v1 contract components.
paths:
  /api/v1/device/batches:
    post:
      summary: Atomically ingest one immutable Device GPS Batch.
      security:
        - deviceBearer: []
      parameters:
        - name: X-LifeTrail-Batch-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: X-LifeTrail-Schema
          in: header
          required: true
          schema: { type: string, enum: [gps/1] }
        - name: X-LifeTrail-Content-SHA256
          in: header
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{64}$' }
        - name: X-LifeTrail-Byte-Length
          in: header
          required: true
          schema: { type: integer, minimum: 0 }
        - name: X-LifeTrail-Record-Count
          in: header
          required: true
          schema: { type: integer, minimum: 0 }
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Batch committed or a verified idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchAcknowledgement' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/devices:
    get:
      summary: List Devices for the local unauthenticated Web.
      responses:
        '200':
          description: Devices in stable creation order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceList'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/devices/{deviceId}:
    get:
      summary: Look up one Device for the local unauthenticated Web.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Device found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/devices/{deviceId}/days/{date}:
    get:
      summary: Read the published or Raw Daily View for one Device Owner-local calendar day.
      description: >-
        A published response carries the complete snapshot: chronological
        projected Trips and Stops, canonical Route Parts with server-owned
        progress, evidence state and provenance. Raw GPS remains immutable and
        separately selectable.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: date
          in: path
          required: true
          description: Owner-local ISO 8601 calendar date.
          schema:
            type: string
            format: date
        - name: view
          in: query
          required: false
          description: Request the established Raw GPS projection even when a processed snapshot is published. Omit to read the published view with Raw fallback.
          schema: { type: string, enum: [raw] }
      responses:
        '200':
          description: Raw GPS projection for the requested Owner-local day, including an empty response when no route points exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyView'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/device:
    get:
      summary: Resolve the Device represented by a Bearer token.
      security:
        - deviceBearer: []
      responses:
        '200':
          description: Authenticated Device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/devices/{deviceId}/days/{date}/status:
    get:
      summary: Read lightweight publication status without route geometry.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: date
          in: path
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Current day publication and processing status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcessingStatus' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    deviceBearer:
      type: http
      scheme: bearer
  schemas:
    BatchAcknowledgement:
      type: object
      additionalProperties: false
      required: [batch_id, status, record_count, duplicate]
      properties:
        batch_id: { type: string, format: uuid }
        status: { type: string, enum: [committed] }
        record_count: { type: integer, minimum: 1 }
        duplicate: { type: boolean }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: Stable machine-readable API-v1 error code.
            message:
              type: string
              description: Human-readable message; clients must not branch on it.
            request_id:
              type: string
              description: Identifier that correlates the response with server logs.
            details:
              type: object
              description: Optional structured diagnostic detail, such as line, field, and reason.
              additionalProperties: true
    Device:
      type: object
      additionalProperties: false
      required: [id, owner_user_id, name, timezone]
      properties:
        id:
          type: string
          format: uuid
        owner_user_id:
          type: string
          format: uuid
        name:
          type: string
        timezone:
          type: string
          description: Device Owner IANA timezone.
    DeviceList:
      type: object
      additionalProperties: false
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: '#/components/schemas/Device'
    DailyView:
      type: object
      additionalProperties: false
      required: [device_id, date, timezone, processing_state, summary, route, start, end]
      allOf:
        - if:
            properties:
              processing_state: { const: processed }
            required: [processing_state]
          then:
            required: [processing, evidence_state, provenance, route_parts, timeline, evidence_holes]
            properties:
              summary:
                required: [usable_point_count, low_quality_point_count, excluded_point_count, trip_duration_s, stop_duration_s, gap_duration_s, trip_count, stop_count, gap_count]
      properties:
        device_id: { type: string, format: uuid }
        date: { type: string, format: date }
        timezone: { type: string, description: Device Owner IANA timezone. }
        processing_state: { type: string, enum: [raw, processed] }
        summary:
          $ref: '#/components/schemas/DailySummary'
        route:
          oneOf:
            - $ref: '#/components/schemas/LineStringFeature'
            - type: 'null'
        start:
          oneOf:
            - $ref: '#/components/schemas/PointFeature'
            - type: 'null'
        end:
          oneOf:
            - $ref: '#/components/schemas/PointFeature'
            - type: 'null'
        processing:
          $ref: '#/components/schemas/ProcessingStatus'
        evidence_state: { type: string, enum: [sufficient, partial, insufficient] }
        provenance:
          $ref: '#/components/schemas/SnapshotProvenance'
        route_parts:
          type: array
          description: >-
            Canonical processed geometry, in movement order. Each part is a
            drawable portion of one Movement Segment with server-owned progress;
            Web never recomputes Route length from the coordinates.
          items: { $ref: '#/components/schemas/RoutePart' }
        timeline:
          type: array
          description: >-
            Projected Trip, Stop and GPS Gap items in chronological observed
            order. A Gap is an interval without Raw observations: it asserts no
            movement, Stop or Route connector.
          items: { $ref: '#/components/schemas/DailyActivity' }
        evidence_holes:
          type: array
          description: >-
            Intervals that contain Raw GPS observations but cannot support
            reliable activity or geometry. Separate from Timeline events: a hole
            never becomes a GPS Gap, and the activity beside it keeps open
            actual boundaries.
          items: { $ref: '#/components/schemas/EvidenceHole' }
    DailyActivity:
      description: >-
        Revision-local UTC Trip, Stop or GPS Gap with its Owner-local daily
        projection.
      oneOf:
        - $ref: '#/components/schemas/DailyTrip'
        - $ref: '#/components/schemas/DailyStop'
        - $ref: '#/components/schemas/DailyGap'
    DailyActivityBoundaries:
      type: object
      description: >-
        Shared projection fields. Actual boundaries are null when open, so an
        unknown arrival or departure is never presented as confirmed; observed
        bounds are always known and never extrapolated to the current time or the
        end of the calendar day.
      required: [id, kind, activity_revision, observed_from_at, observed_until_at, observed_duration_s, actual_start_at, actual_end_at, start_boundary, end_boundary, full_duration_s, quality, source_record_count, usable_record_count, source_record_ids, visible_from_at, visible_until_at, daily_observed_duration_s, continues_before, continues_after]
      properties:
        id:
          type: string
          description: Revision-local event identity, stable only within its creating Activity Revision.
        kind: { type: string, enum: [trip, stop] }
        activity_revision: { type: string, format: uuid }
        observed_from_at: { type: string, format: date-time }
        observed_until_at: { type: string, format: date-time }
        observed_duration_s: { type: integer, minimum: 0 }
        actual_start_at: { type: [string, 'null'], format: date-time }
        actual_end_at: { type: [string, 'null'], format: date-time }
        start_boundary: { type: string, enum: [confirmed, open] }
        end_boundary: { type: string, enum: [confirmed, open] }
        full_duration_s: { type: [integer, 'null'], minimum: 0 }
        quality: { type: string, enum: [sufficient] }
        source_record_count: { type: integer, minimum: 0 }
        usable_record_count: { type: integer, minimum: 0 }
        source_record_ids:
          type: array
          items: { type: integer }
        visible_from_at: { type: string, format: date-time }
        visible_until_at: { type: string, format: date-time }
        daily_observed_duration_s:
          type: integer
          minimum: 0
          description: Only strictly positive observed overlap with this day counts.
        continues_before:
          type: boolean
          description: Observed coverage extends before this day; not inferred unobserved continuation.
        continues_after:
          type: boolean
          description: Observed coverage extends after this day; not inferred unobserved continuation.
    DailyTrip:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/DailyActivityBoundaries'
        - type: object
          required: [kind, distance_m, movement_segment_count, movement_segments]
          properties:
            kind: { type: string, enum: [trip] }
            distance_m:
              type: number
              minimum: 0
              description: Sum of this Trip's published Route Part lengths in UTC history.
            movement_segment_count: { type: integer, minimum: 1 }
            movement_segments:
              type: array
              minItems: 1
              description: Ordered Movement Segments. A mode change separates segments without ending the Trip.
              items: { $ref: '#/components/schemas/MovementSegment' }
    MovementSegment:
      type: object
      additionalProperties: false
      description: >-
        A portion of a Trip with a relatively homogeneous transport mode. This
        slice publishes raw fallback geometry. Classification is independent of
        matching: `unknown` and below-threshold candidates never select a route profile.
      required: [id, mode, classification_confidence, source, observed_from_at, observed_until_at, observed_duration_s, distance_m, quality, route_part_ids, source_record_count]
      properties:
        id: { type: string, description: Revision-local Movement Segment identity. }
        mode: { type: string, enum: [unknown, walk, bike, car] }
        classification_confidence: { type: number, minimum: 0, maximum: 1, description: Windowed evidence confidence retained with the immutable Activity Revision. }
        source: { type: string, enum: [raw] }
        observed_from_at: { type: string, format: date-time }
        observed_until_at: { type: string, format: date-time }
        observed_duration_s: { type: integer, minimum: 0 }
        distance_m: { type: number, minimum: 0 }
        quality: { type: string, enum: [sufficient] }
        route_part_ids:
          type: array
          items: { type: string }
          description: Ordered drawable Route Parts for this Movement Segment.
        source_record_count: { type: integer, minimum: 0 }
    RoutePart:
      type: object
      additionalProperties: false
      description: >-
        A contiguous drawable portion of the derived Route for one Movement
        Segment, clipped to this day. Coordinates come from accepted GPS Records:
        no coordinate or timestamp is invented, and a Part is never padded to
        satisfy the LineString contract.
      required: [id, kind, trip_id, movement_segment_id, source, mode, classification_confidence, observed_from_at, observed_until_at, distance_m, visible_distance_m, quality, source_record_count, visible_from_at, visible_until_at, continues_before, continues_after, geometry, vertex_distance_m, progress_anchors]
      properties:
        id: { type: string }
        kind: { type: string, enum: [route_part] }
        trip_id: { type: string }
        movement_segment_id: { type: string }
        source: { type: string, enum: [raw] }
        mode: { type: string, enum: [unknown, walk, bike, car] }
        classification_confidence: { type: number, minimum: 0, maximum: 1 }
        observed_from_at:
          type: string
          format: date-time
          description: Observed coverage of the whole Movement Segment portion, independent of the day.
        observed_until_at: { type: string, format: date-time }
        distance_m:
          type: number
          minimum: 0
          description: Length of the whole Part in UTC history, server-owned.
        visible_distance_m:
          type: number
          minimum: 0
          description: >-
            The Part's contribution to this day: the difference in original
            progress at the clipping endpoints. Adjacent days conserve
            distance_m.
        quality: { type: string, enum: [sufficient] }
        source_record_count: { type: integer, minimum: 2 }
        visible_from_at: { type: string, format: date-time }
        visible_until_at: { type: string, format: date-time }
        continues_before: { type: boolean }
        continues_after: { type: boolean }
        geometry: { $ref: '#/components/schemas/LineStringGeometry' }
        vertex_distance_m:
          type: array
          minItems: 2
          description: >-
            Cumulative progress from zero, aligned one-to-one with
            geometry.coordinates. Non-decreasing, and the final value equals
            visible_distance_m within numerical tolerance. Clients use this
            metric rather than recomputing Route length.
          items: { type: number, format: double, minimum: 0 }
        progress_anchors:
          type: array
          minItems: 2
          description: >-
            Historical instants mapped to progress along this Part. Times
            increase strictly, progress is non-decreasing and bounded by
            distance_m, and both endpoints carry an anchor. Clipping may add a
            synthetic anchor at a calendar boundary. There is deliberately no
            one-timestamp-per-vertex contract.
          items: { $ref: '#/components/schemas/ProgressAnchor' }
    ProgressAnchor:
      type: object
      additionalProperties: false
      required: [at, distance_m]
      properties:
        at: { type: string, format: date-time }
        distance_m:
          type: number
          format: double
          minimum: 0
          description: Progress at `at`, rebased so the first visible anchor is zero.
    DailyStop:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/DailyActivityBoundaries'
        - type: object
          required: [kind, center, radius_m]
          properties:
            kind: { type: string, enum: [stop] }
            center:
              type: array
              minItems: 2
              maxItems: 2
              items: { type: number }
              description: Server-derived dwell anchor in longitude/latitude order.
            radius_m: { type: number, minimum: 0, description: Maximum observed distance from the dwell anchor. }
    DailyGap:
      unevaluatedProperties: false
      description: >-
        A GPS Gap: an interval without Raw GPS observations between two known
        observations, projected into one Owner-local day. It ends Trip
        continuity and contributes only its own duration. It asserts no
        movement, Stop, matcher filling or straight Route connector, and it is
        never created by quality filtering.
      required: [id, kind, activity_revision, observed_from_at, observed_until_at, observed_duration_s, visible_from_at, visible_until_at, daily_observed_duration_s, continues_before, continues_after]
      properties:
        id:
          type: string
          description: Revision-local event identity, stable only within its creating Activity Revision.
        kind: { type: string, enum: [gap] }
        activity_revision: { type: string, format: uuid }
        observed_from_at: { type: string, format: date-time }
        observed_until_at: { type: string, format: date-time }
        observed_duration_s: { type: integer, minimum: 0 }
        visible_from_at: { type: string, format: date-time }
        visible_until_at: { type: string, format: date-time }
        daily_observed_duration_s:
          type: integer
          minimum: 0
          description: Only strictly positive observed overlap with this day counts.
        continues_before:
          type: boolean
          description: The absence begins before this day; not inferred unobserved continuation.
        continues_after:
          type: boolean
          description: The absence ends after this day; not inferred unobserved continuation.
    EvidenceHole:
      type: object
      additionalProperties: false
      description: >-
        An interval that contains Raw GPS observations but cannot support
        reliable activity or geometry. Distinct from a GPS Gap, which is the
        absence of observations; neither asserts a Trip, Stop or fabricated
        duration.
      required: [observed_from_at, observed_until_at, reason, source_record_count]
      properties:
        observed_from_at: { type: string, format: date-time }
        observed_until_at: { type: string, format: date-time }
        reason:
          type: string
          enum: [insufficient_quality, insufficient_geometry, ambiguous_activity]
          description: >-
            Why the existing observations cannot support activity.
            `insufficient_quality` is unreliable acquisition metadata,
            `insufficient_geometry` includes an impossible jump, and
            `ambiguous_activity` is reliable evidence of no particular activity.
            A matcher failure alone is not a hole.
        source_record_count:
          type: integer
          minimum: 0
          description: Raw GPS Records inside this interval.
    DailySummary:
      type: object
      additionalProperties: false
      required: [point_count, distance_m, duration_s, first_fix_at, last_fix_at]
      properties:
        point_count:
          type: integer
          minimum: 0
          description: Every Raw GPS Record in the local day, independently of usable quality.
        distance_m:
          type: number
          format: double
          minimum: 0
          description: Sum of published Route Part lengths visible in this day; no rejected geometry or implicit connector.
        duration_s:
          type: integer
          minimum: 0
          description: Observed activity duration in this day across Trips, Stops and GPS Gaps.
        first_fix_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        last_fix_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        usable_point_count:
          type: integer
          minimum: 0
          description: >-
            Raw GPS Records classified reliable enough to support a Stop, Trip or
            Route Part.
        low_quality_point_count:
          type: integer
          minimum: 0
          description: >-
            Raw GPS Records that exist but whose acquisition metadata cannot
            support reliable activity. Disclosed coverage, not an impossible
            position.
        excluded_point_count:
          type: integer
          minimum: 0
          description: >-
            Raw GPS Records withheld from derived geometry as impossible. Still
            present in Raw GPS. The three class counts always sum to
            point_count.
        trip_duration_s:
          type: integer
          minimum: 0
          description: >-
            Observed time inside Trips, including pauses below the Stop
            criteria. This is not physical moving duration and must not be
            labeled as such.
        stop_duration_s: { type: integer, minimum: 0 }
        gap_duration_s: { type: integer, minimum: 0 }
        trip_count: { type: integer, minimum: 0 }
        stop_count: { type: integer, minimum: 0 }
        gap_count: { type: integer, minimum: 0 }
    ProcessingStatus:
      type: object
      additionalProperties: false
      required: [state, data_freshness, published_revision, input_generation, timezone, timezone_generation, deferred_reason, failure_message]
      properties:
        state: { type: string, enum: [idle, queued, running, failed] }
        data_freshness: { type: string, enum: [current, stale, stale_source, unavailable] }
        published_revision: { type: [string, 'null'], format: uuid }
        input_generation: { type: integer, minimum: 0 }
        timezone: { type: string }
        timezone_generation: { type: integer, minimum: 0 }
        deferred_reason: { type: [string, 'null'], enum: [activity_processing_not_available, null] }
        failure_message: { type: [string, 'null'] }
    SnapshotProvenance:
      type: object
      additionalProperties: false
      required: [manifest_version, source_raw_generation, processed_through_generation, processing_target, processing_target_generation, timezone_generation, reducer_version, projection_schema_version]
      properties:
        manifest_version: { type: string, format: uuid }
        source_raw_generation: { type: integer, minimum: 0 }
        processed_through_generation: { type: integer, minimum: 0 }
        processing_target: { type: string }
        processing_target_generation: { type: integer, minimum: 0 }
        timezone_generation: { type: integer, minimum: 0 }
        reducer_version: { type: integer, minimum: 1 }
        projection_schema_version: { type: integer, minimum: 1 }
    PointGeometry:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [Point] }
        coordinates:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: number, format: double }
    LineStringGeometry:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [LineString] }
        coordinates:
          type: array
          minItems: 2
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: number, format: double }
    LineStringFeature:
      type: object
      additionalProperties: false
      required: [type, properties, geometry]
      properties:
        type: { type: string, enum: [Feature] }
        properties:
          type: object
          additionalProperties: false
          required: [timestamps]
          properties:
            timestamps:
              type: array
              minItems: 2
              description: >-
                RFC 3339 UTC timestamp for each route coordinate.
                timestamps.length must equal geometry.coordinates.length,
                and timestamps[i] describes coordinates[i].
                Timestamps are monotonic non-decreasing.
              items: { type: string, format: date-time }
        geometry: { $ref: '#/components/schemas/LineStringGeometry' }
    PointFeature:
      type: object
      additionalProperties: false
      required: [type, properties, geometry]
      properties:
        type: { type: string, enum: [Feature] }
        properties:
          type: object
          additionalProperties: false
          required: [recorded_at]
          properties:
            recorded_at: { type: string, format: date-time }
        geometry: { $ref: '#/components/schemas/PointGeometry' }
  responses:
    Error:
      description: Canonical API-v1 error envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
