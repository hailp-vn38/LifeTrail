openapi: 3.1.0
info:
  title: LifeTrail API
  version: v1
  description: Phase 1 reusable API-v1 contract components.
paths:
  /api/v1/device/batches:
    post:
      summary: Atomically ingest one immutable Device GPS Batch.
      security:
        - deviceBearer: []
      parameters:
        - name: X-LifeTrail-Batch-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: X-LifeTrail-Schema
          in: header
          required: true
          schema: { type: string, enum: [gps/1] }
        - name: X-LifeTrail-Content-SHA256
          in: header
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{64}$' }
        - name: X-LifeTrail-Byte-Length
          in: header
          required: true
          schema: { type: integer, minimum: 0 }
        - name: X-LifeTrail-Record-Count
          in: header
          required: true
          schema: { type: integer, minimum: 0 }
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Batch committed or a verified idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchAcknowledgement' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/devices:
    get:
      summary: List Devices for the local unauthenticated Web.
      responses:
        '200':
          description: Devices in stable creation order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceList'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/devices/{deviceId}:
    get:
      summary: Look up one Device for the local unauthenticated Web.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Device found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/device:
    get:
      summary: Resolve the Device represented by a Bearer token.
      security:
        - deviceBearer: []
      responses:
        '200':
          description: Authenticated Device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    deviceBearer:
      type: http
      scheme: bearer
  schemas:
    BatchAcknowledgement:
      type: object
      additionalProperties: false
      required: [batch_id, status, record_count, duplicate]
      properties:
        batch_id: { type: string, format: uuid }
        status: { type: string, enum: [committed] }
        record_count: { type: integer, minimum: 1 }
        duplicate: { type: boolean }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: Stable machine-readable API-v1 error code.
            message:
              type: string
              description: Human-readable message; clients must not branch on it.
            request_id:
              type: string
              description: Identifier that correlates the response with server logs.
            details:
              type: object
              description: Optional structured diagnostic detail, such as line, field, and reason.
              additionalProperties: true
    Device:
      type: object
      additionalProperties: false
      required: [id, owner_user_id, name]
      properties:
        id:
          type: string
          format: uuid
        owner_user_id:
          type: string
          format: uuid
        name:
          type: string
    DeviceList:
      type: object
      additionalProperties: false
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: '#/components/schemas/Device'
  responses:
    Error:
      description: Canonical API-v1 error envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
