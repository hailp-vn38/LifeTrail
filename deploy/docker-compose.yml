name: lifetrail
services:
  postgres:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    environment:
      POSTGRES_DB: lifetrail
      POSTGRES_USER: lifetrail
      POSTGRES_PASSWORD: lifetrail_dev_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifetrail -d lifetrail"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    environment:
      LT_DATABASE_URL: postgres://lifetrail:lifetrail_dev_only@postgres:5432/lifetrail
      LT_BIND_ADDR: 0.0.0.0:8080
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        VITE_MAP_STYLE_URL: ${VITE_MAP_STYLE_URL:-}
        VITE_MAPTILER_KEY: ${VITE_MAPTILER_KEY:-}
    depends_on:
      - server
    ports:
      - "8080:80"

  server-tests:
    profiles: ["test"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.test
    environment:
      LT_TEST_DATABASE_URL: postgres://lifetrail:lifetrail_dev_only@postgres-test:5432/lifetrail_test
    depends_on:
      postgres-test:
        condition: service_healthy

  postgres-test:
    profiles: ["test"]
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    environment:
      POSTGRES_DB: lifetrail_test
      POSTGRES_USER: lifetrail
      POSTGRES_PASSWORD: lifetrail_dev_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifetrail -d lifetrail_test"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

  osrm-car:
    profiles: [osrm]
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0@sha256:729461bcc9ae9e6aafa92c0f93db9b060a32e85d5e72092c01ae4a4a9f1eb564
    command: [osrm-routed, --algorithm, mld, --threads, "2", /data/test-region.osrm]
    expose: ["5000"]
    volumes:
      - ../data/osrm/${LT_OSRM_DATASET_VERSION:-monaco-test}/car:/data:ro

  osrm-bike:
    profiles: [osrm]
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0@sha256:729461bcc9ae9e6aafa92c0f93db9b060a32e85d5e72092c01ae4a4a9f1eb564
    command: [osrm-routed, --algorithm, mld, --threads, "2", /data/test-region.osrm]
    expose: ["5000"]
    volumes:
      - ../data/osrm/${LT_OSRM_DATASET_VERSION:-monaco-test}/bike:/data:ro

  osrm-foot:
    profiles: [osrm]
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0@sha256:729461bcc9ae9e6aafa92c0f93db9b060a32e85d5e72092c01ae4a4a9f1eb564
    command: [osrm-routed, --algorithm, mld, --threads, "2", /data/test-region.osrm]
    expose: ["5000"]
    volumes:
      - ../data/osrm/${LT_OSRM_DATASET_VERSION:-monaco-test}/foot:/data:ro

  simulator:
    profiles: [osrm-tools]
    image: python:3.13-slim-bookworm
    working_dir: /workspace
    volumes:
      - ../tools:/workspace/tools:ro
      - ../data/osrm:/workspace/data/osrm:ro
      - ../runtime:/workspace/runtime
    entrypoint: [python, tools/generate_routed_scenario.py]

volumes:
  postgres_data:
  postgres_test_data:
