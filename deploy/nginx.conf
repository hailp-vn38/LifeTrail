# LifeTrail web (Nginx) configuration.
#
# - `/` and `/assets/*` serve the built Vue SPA with an SPA fallback, so
#   Vue Router deep links (e.g. /devices/:id/day/:date) work on reload.
# - `/api/*` is reverse-proxied to the Rust server on the Compose network.
#   `server` must never appear in browser JavaScript; it only exists here.
#
# If SSE is introduced later, extend the `/api/` location with
# `proxy_buffering off;` for the SSE endpoint.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
